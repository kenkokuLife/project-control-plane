name: Daily Control Plane rebuild

on:
  schedule:
    # 00:17 UTC = 09:17 JST, every day.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          CONTROL_PLANE_DEPLOY_HOOK: ${{ secrets.CONTROL_PLANE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$CONTROL_PLANE_DEPLOY_HOOK" ]]; then
            echo 'Missing GitHub secret: CONTROL_PLANE_DEPLOY_HOOK' >&2
            exit 1
          fi
          if ! curl --proto '=https' --fail --silent --output /dev/null \
            --max-time 30 --request POST "$CONTROL_PLANE_DEPLOY_HOOK" 2>/dev/null; then
            echo 'Cloudflare Pages Deploy Hook request failed; check the secret and Pages deployments.' >&2
            exit 1
          fi
